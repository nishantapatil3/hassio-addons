network:
  8642/tcp: Hermes OpenAI-compatible API port
  9119/tcp: Hermes web dashboard port

configuration:
  openrouter_api_key:
    name: OpenRouter API key
    description: API key for OpenRouter model access.
  anthropic_api_key:
    name: Anthropic API key
    description: API key for direct Anthropic model access.
  openai_api_key:
    name: OpenAI API key
    description: API key for OpenAI-compatible providers.
  openai_base_url:
    name: OpenAI-compatible base URL
    description: Optional base URL for a local or self-hosted OpenAI-compatible provider.
  google_api_key:
    name: Google API key
    description: API key for Google AI Studio model access.
  nous_api_key:
    name: Nous API key
    description: API key for Nous Portal model access.
  github_token:
    name: GitHub token
    description: Optional token for higher Skills Hub API limits and GitHub tools.
  hass_token:
    name: Home Assistant token
    description: Optional long-lived token; the Supervisor token is used when this is empty.
  hass_url:
    name: Home Assistant URL
    description: Home Assistant API base URL, normally http://supervisor/core for this app.
  telegram_bot_token:
    name: Telegram bot token
    description: Optional Telegram bot token from BotFather.
  telegram_allowed_users:
    name: Telegram allowed users
    description: Comma-separated Telegram user IDs allowed to use the bot.
  discord_bot_token:
    name: Discord bot token
    description: Optional Discord bot token.
  discord_allowed_users:
    name: Discord allowed users
    description: Comma-separated Discord user IDs allowed to use the bot.
  gateway_allow_all_users:
    name: Allow all gateway users
    description: Disable gateway allowlists. Use only on a trusted private network.
  api_server_enabled:
    name: Enable API server
    description: Expose the OpenAI-compatible API on port 8642.
  api_server_key:
    name: API server key
    description: Authentication key for the API server, at least 8 characters.
  api_server_cors_origins:
    name: API server CORS origins
    description: Optional comma-separated CORS origins for browser clients.
  dashboard_enabled:
    name: Enable dashboard
    description: Expose the Hermes web dashboard on port 9119.
  dashboard_username:
    name: Dashboard username
    description: Username required by the dashboard basic-auth login.
  dashboard_password:
    name: Dashboard password
    description: Password required by the dashboard basic-auth login.
  dashboard_secret:
    name: Dashboard session secret
    description: Optional stable secret used to keep dashboard sessions across restarts.
