network:
  4000/tcp: LiteLLM API and admin UI port

configuration:
  master_key:
    name: Master key
    description: >-
      API key clients use to authenticate with LiteLLM. Must start with `sk-`.
      Used as LITELLM_MASTER_KEY in litellm.yaml.
  openrouter_api_key:
    name: OpenRouter API key
    description: >-
      API key from openrouter.ai. Used as OPENROUTER_API_KEY in litellm.yaml.
  nvidia_api_key:
    name: NVIDIA NIM API key
    description: >-
      API key from build.nvidia.com for direct NIM endpoints.
      Used as NVIDIA_NIM_API_KEY in litellm.yaml.
  database_url:
    name: Database URL
    description: >-
      PostgreSQL connection string for the admin UI, virtual keys, and spend
      tracking. Example: postgresql://litellm:password@192.168.1.10:5432/litellm.
      Used as DATABASE_URL in litellm.yaml.
  redis_url:
    name: Redis URL
    description: >-
      Redis connection string for response caching.
      Example: redis://:password@192.168.1.10:6379/0.
      Used as REDIS_URL in litellm.yaml.
  searxng_api_base:
    name: SearXNG base URL
    description: >-
      Base URL of a SearXNG instance for web-search interception.
      Example: http://192.168.1.10:8081.
      Used as SEARXNG_API_BASE in litellm.yaml.
  server_root_path:
    name: Server root path
    description: >-
      Optional base path if LiteLLM is served under a sub-path (e.g. /litellm).
      Leave empty to serve from the root. Used as SERVER_ROOT_PATH.
  log_level:
    name: Log level
    description: >-
      LiteLLM log verbosity. One of INFO, WARNING, ERROR, DEBUG.
      Used as LITELLM_LOG.
  custom_config:
    name: Custom config (legacy)
    description: Legacy option — not used. Configuration is now via litellm.yaml.
  enable_prometheus:
    name: Enable Prometheus (legacy)
    description: Legacy option — not used. Configure callbacks in litellm.yaml.
  enable_file_guardrail:
    name: Enable file guardrail (legacy)
    description: Legacy option — not used. Configure guardrails in litellm.yaml.
