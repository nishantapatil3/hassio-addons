# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: LiteLLM
version: "1.0.11"
slug: litellm
description: >-
  AI gateway for Claude Code and Claude Desktop using OpenRouter and NVIDIA NIM.
url: https://github.com/nishantapatil3/hassio-addons/tree/main/litellm
arch:
  - aarch64
  - amd64
hostname: litellm
init: false
backup: cold
ports:
  4000/tcp: 4000
ports_description:
  4000/tcp: LiteLLM API and admin UI
webui: http://[HOST]:[PORT:4000]/ui
map:
  - app_config:rw
options:
  master_key: "sk-change-me"
  openrouter_api_key: ""
  nvidia_api_key: ""
  database_url: ""
  redis_url: ""
  searxng_api_base: ""
  server_root_path: ""
  log_level: "INFO"
  custom_config: ""
  enable_prometheus: true
  enable_file_guardrail: true
schema:
  master_key: str
  openrouter_api_key: str?
  nvidia_api_key: str?
  database_url: str?
  redis_url: str?
  searxng_api_base: str?
  server_root_path: str?
  log_level: str?
  custom_config: str?
  enable_prometheus: bool?
  enable_file_guardrail: bool?
image: ghcr.io/nishantapatil3/litellm
