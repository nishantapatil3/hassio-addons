# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: LiteLLM
version: "1.0.18"
slug: litellm
description: >-
  AI gateway for Claude Code and Claude Desktop using OpenRouter.
url: https://github.com/nishantapatil3/hassio-addons/tree/main/litellm
arch:
  - aarch64
  - amd64
init: false
backup: cold
ports:
  4000/tcp: 4000
ports_description:
  4000/tcp: LiteLLM API and admin UI
webui: http://[HOST]:[PORT:4000]/ui
map:
  - type: addon_config
    read_only: false
options:
  master_key: ""
  openrouter_api_key: ""
  server_root_path: ""
schema:
  master_key: str
  openrouter_api_key: str
  server_root_path: str
image: ghcr.io/nishantapatil3/litellm
