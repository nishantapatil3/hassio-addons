# LiteLLM proxy configuration
# Edit this file and restart the add-on to apply changes.
# Full reference: https://docs.litellm.ai/docs/proxy/configs

model_list:
  # ============================================================
  # Claude Code models — Claude model names mapped to free NVIDIA
  # NIM models via OpenRouter. Replace with any supported backend.
  # ============================================================
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: openrouter/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
      api_key: sk-your-openrouter-api-key
    model_info:
      supports_function_calling: true
      supports_web_search: true
      supports_vision: false
      cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 0

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: sk-your-openrouter-api-key
    model_info:
      supports_function_calling: true
      supports_web_search: true
      supports_vision: false
      cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 0

  - model_name: claude-opus-4-8
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: sk-your-openrouter-api-key
    model_info:
      supports_function_calling: true
      supports_web_search: true
      supports_vision: false
      cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 0

  # ============================================================
  # NVIDIA NIM direct — uncomment and set your api_key to use
  # NIM endpoints directly without OpenRouter.
  # ============================================================
  # - model_name: nemotron-3-ultra-550b-a55b
  #   litellm_params:
  #     model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
  #     api_key: nvapi-your-nvidia-api-key
  #   model_info:
  #     supports_function_calling: true
  #     supports_web_search: true
  #     supports_vision: false
  #     cache_creation_input_token_cost: 0
  #     cache_read_input_token_cost: 0

litellm_settings:
  drop_params: true
  modify_params: true
  set_verbose: false
  global_max_parallel_requests: 100
  allowed_fails: 5
  cooldown_time: 600
  callbacks:
    - prometheus
  # To enable SearXNG web-search interception, replace the callbacks block with:
  # callbacks:
  #   - websearch_interception
  #   - prometheus
  # websearch_interception_params:
  #   search_tool_name: searxng-search
  #   enabled_providers:
  #     - openrouter
  #     - anthropic
  #     - openai
  prometheus_initialize_budget_metrics: true
  prometheus_emit_stream_label: true
  require_auth_for_metrics_endpoint: false
  # To enable Redis response caching, uncomment and fill in your Redis URL:
  # cache: true
  # cache_params:
  #   type: redis
  #   url: redis://:password@192.168.1.10:6379/0
  #   namespace: litellm-cache
  #   ttl: 600

router_settings:
  fallbacks:
    - claude-opus-4-8:
        - claude-sonnet-4-6
    - claude-sonnet-4-6:
        - claude-haiku-4-5-20251001

# To enable SearXNG web-search tool calls, uncomment and fill in your base URL
# (also update callbacks above):
# search_tools:
#   - search_tool_name: searxng-search
#     litellm_params:
#       search_provider: searxng
#       api_base: http://192.168.1.10:8081

general_settings:
  master_key: sk-change-me
  # To enable the admin UI, virtual keys, and spend tracking, uncomment and fill
  # in your PostgreSQL connection string (requires a PostgreSQL instance — see docs):
  # database_url: postgresql://litellm:password@192.168.1.10:5432/litellm
  # store_model_in_db: true
  store_prompts_in_spend_logs: true
  use_x_forwarded_for: true
  enforce_user_param: false
  fail_closed_budget_enforcement: true
  reject_clientside_metadata_tags: true

guardrails:
  - guardrail_name: no-file-input
    litellm_params:
      guardrail: no_file_input_guardrail.NoFileInputGuardrail
      mode: pre_call
      default_on: true
